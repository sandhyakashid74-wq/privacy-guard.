<!DOCTYPE html>
<html lang="en">
<head>

</head>

<body>

    <div class="container">

        <h1>Privacy Guard</h1>

        <h2>Terms & Conditions</h2>

        <p>
            Welcome to Privacy Guard. This tool helps you understand

        <label for="terms">Paste Terms & Conditions:</label>

        <textarea id="terms"
            placeholder="Paste the Terms & Conditions here..."></textarea>

        <br><br>

        <div id="result"></div>

        <br>

        <button onclick="goNext()">Next →</button>

    </div>

    <script src="script.js"></script>

        function goNext() {

        }
    </script>
